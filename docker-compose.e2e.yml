services:
  # Built locally from migration stage; decoupled from production API image.
  migration:
    image: hotel-booking-migration:local
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    command: ["up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-hotel_booking}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-netologist/hotel-booking}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-hotel_booking}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_started

  api-healthcheck:
    image: alpine/curl:3.14
    command: tail -f /dev/null
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://api:8080/healthz || exit 1"]
      interval: 2s
      retries: 15
      start_period: 2s
      timeout: 3s
    depends_on:
      api:
        condition: service_started

  # Test runner is built locally only; never pulled from or pushed to a registry.
  e2e:
    image: hotel-booking-e2e:local
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      BASE_URL: http://api:8080
    depends_on:
      api-healthcheck:
        condition: service_healthy
