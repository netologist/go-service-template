name: CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-spec:
    name: OpenAPI Spec Validation & Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate API code
        run: go tool oapi-codegen -config oapi-codegen.yml api/openapi.yaml

      - name: Ensure generated code is in sync
        run: |
          if ! git diff --exit-code internal/gen/openapi/api.gen.go; then
            echo "Error: OpenAPI generated files are out of sync. Run 'mise run generate:openapi' and commit the changes."
            exit 1
          fi

  validate-mocks:
    name: Mockery Validation & Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate Mocks
        run: go tool mockery

      - name: Ensure mocks are in sync
        run: |
          if ! git diff --exit-code internal/gen/mocks; then
            echo "Error: Generated mocks are out of sync. Run 'mise run mocks:generate' and commit the changes."
            exit 1
          fi

  validate-sqlc:
    name: SQL Queries Validation & Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate SQL Queries
        run: go tool sqlc generate

      - name: Ensure SQL queries are in sync
        run: |
          if ! git diff --exit-code internal/gen/sqlc; then
            echo "Error: Generated SQL code is out of sync. Run 'mise run generate:sqlc' and commit the changes."
            exit 1
          fi

  security:
    name: Security Checks (Secrets & Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Gitleaks secret detection
        run: go tool gitleaks detect --verbose

      - name: Run Govulncheck vulnerability scanner
        run: go tool govulncheck ./...

  lint:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go imports formatting
        run: |
          UNFORMATTED=$(go tool goimports -l $(find . -type f -name '*.go' -not -path './vendor/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files detected:"
            echo "$UNFORMATTED"
            echo "Run 'mise run format' to fix."
            exit 1
          fi

      - name: Run golangci-lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go tool golangci-lint run --new-from-rev=origin/${{ github.base_ref }}
          else
            go tool golangci-lint run --new-from-rev=HEAD~1
          fi

  test:
    name: Test & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with gotestsum
        run: go tool gotestsum --format testname -- -race -covermode=atomic -coverprofile=coverage.out ./internal/...

      - name: Upload test coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build-images:
    name: Build & Push Images (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: [validate-spec, validate-mocks, validate-sqlc, security, lint, test]
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: api
            image_suffix: ""
            dockerfile: Dockerfile
            target: ""
          - name: migration
            image_suffix: "-migration"
            dockerfile: Dockerfile.e2e
            target: "builder"
          - name: e2e
            image_suffix: "-e2e"
            dockerfile: Dockerfile.e2e
            target: "runner"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (SHA and branch tags, NO latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.service.image_suffix }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build and Push Docker image (${{ matrix.service.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  scan-api:
    name: Trivy Security Scan (API Image)
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA tag
        id: vars
        run: echo "short_sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner on built API image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: "Gate: Fail if API image has unmitigated CRITICAL or HIGH vulnerabilities"
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  e2e:
    name: End-to-End Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA tag
        id: vars
        run: echo "short_sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Pull pre-built images from GHCR
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml pull api migration e2e

      - name: Run E2E test suite using pulled images
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --no-build --abort-on-container-exit --exit-code-from e2e

      - name: Clean up Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  tag-latest:
    name: Tag & Promote Verified Images to Latest
    runs-on: ubuntu-latest
    needs: [e2e, scan-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA tag
        id: vars
        run: echo "short_sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Tag and push latest for verified images
        run: |
          for SUFFIX in "" "-migration" "-e2e"; do
            SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${SUFFIX}:${{ steps.vars.outputs.short_sha }}"
            DST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${SUFFIX}:latest"
            echo "Promoting $SRC to $DST..."
            docker pull "$SRC"
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done
