name: CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-spec:
    name: OpenAPI Spec Validation & Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate API code
        run: go tool oapi-codegen -config oapi-codegen.yml api/openapi.yaml

      - name: Ensure generated code is in sync
        run: |
          if ! git diff --exit-code internal/gen/oapi/api.gen.go; then
            echo "Error: OpenAPI generated files are out of sync. Run 'mise run generate:oapi' and commit the changes."
            exit 1
          fi

  validate-mocks:
    name: Mockery Validation & Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate Mocks
        run: go tool mockery

      - name: Ensure mocks are in sync
        run: |
          if ! git diff --exit-code internal/gen/mocks; then
            echo "Error: Generated mocks are out of sync. Run 'mise run generate:mocks' and commit the changes."
            exit 1
          fi

  validate-sqlc:
    name: SQL Queries Validation & Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate SQL Queries
        run: go tool sqlc generate

      - name: Ensure SQL queries are in sync
        run: |
          if ! git diff --exit-code internal/gen/sqlc; then
            echo "Error: Generated SQL code is out of sync. Run 'mise run generate:sqlc' and commit the changes."
            exit 1
          fi

  security:
    name: Security Checks (Secrets & Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Gitleaks secret detection
        run: go tool gitleaks detect --verbose

      - name: Run Govulncheck vulnerability scanner
        run: go tool govulncheck ./...

  lint:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go imports formatting
        run: |
          UNFORMATTED=$(go tool goimports -l $(find . -type f -name '*.go' -not -path './vendor/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files detected:"
            echo "$UNFORMATTED"
            echo "Run 'mise run format' to fix."
            exit 1
          fi

      - name: Run golangci-lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go tool golangci-lint run --new-from-rev=origin/${{ github.base_ref }}
          else
            go tool golangci-lint run --new-from-rev=HEAD~1
          fi

  test:
    name: Test & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with gotestsum
        run: go tool gotestsum --format testname -- -race -covermode=atomic -coverprofile=coverage.out ./internal/...

      - name: Upload test coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build-api:
    name: Build, Scan & Push API Image
    runs-on: ubuntu-latest
    needs: [validate-spec, validate-mocks, validate-sqlc, security, lint, test]
    outputs:
      image_tag: ${{ steps.sha.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (SHA and branch tags, NO latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      # Build once into the runner's Docker daemon; the exact same local image is scanned and then pushed.
      - name: Build API image locally (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Resolve immutable SHA tag
        id: sha
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_REF=$(printf '%s\n' "$TAGS" | grep -m1 ':sha-')
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_REF##*:}" >> "$GITHUB_OUTPUT"

      - name: "Trivy Security Gate: Scan local API image before push"
        env:
          IMAGE_REF: ${{ steps.sha.outputs.image_ref }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:latest \
            image --image-src docker --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH "$IMAGE_REF"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified API image to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue
            docker push "$TAG"
          done <<< "$TAGS"

  e2e:
    name: End-to-End Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [build-api]
    env:
      IMAGE_TAG: ${{ needs.build-api.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified API image from GHCR
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml pull api

      - name: Build E2E test image locally (never pushed)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml build e2e

      - name: Run E2E test suite against verified API image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --no-build --abort-on-container-exit --exit-code-from e2e

      - name: Clean up Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  tag-latest:
    name: Promote Verified API Image to Latest
    runs-on: ubuntu-latest
    needs: [build-api, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push latest for verified API image
        env:
          IMAGE_TAG: ${{ needs.build-api.outputs.image_tag }}
        run: |
          SRC="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          DST="${REGISTRY}/${IMAGE_NAME}:latest"
          echo "Promoting $SRC to $DST..."
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
