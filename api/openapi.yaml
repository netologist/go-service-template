openapi: 3.0.3
info:
  title: Go Service Template API
  description: Clean Architecture REST API template demonstrating ports & adapters, OpenAPI code generation, and PostgreSQL persistence.
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Health check probe
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/items:
    get:
      summary: Find an item based on its name or list all items
      operationId: findItems
      parameters:
        - name: name
          in: query
          required: false
          description: Item name query string
          schema:
            type: string
            example: "Widget"
      responses:
        '200':
          description: Matching items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Register a new item
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    BadRequest:
      description: Bad Request - Validation error or malformed request body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict - Resource already exists or invariant conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ValidationError:
      type: object
      required:
        - name
        - reason
      properties:
        name:
          type: string
          description: Name of the invalid field or parameter
          example: "name"
        reason:
          type: string
          description: Reason why the field is invalid
          example: "must be at least 2 characters long"

    Problem:
      type: object
      description: RFC 9457 Problem Details object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          example: "about:blank"
        title:
          type: string
          description: Short, human-readable summary of the problem type
          example: "Bad Request"
        status:
          type: integer
          description: The HTTP status code generated by the origin server
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem
          example: "name length must be between 2 and 255 characters"
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem
          example: "/api/v1/items"
        code:
          type: string
          description: Application-specific error code
          example: "INVALID_ITEM"
        request_id:
          type: string
          description: Identifier of the request; quote it when reporting a server error so it can be found in the server logs
          example: "7f3c1e2a-4b5d-4c6e-8f90-a1b2c3d4e5f6"
        errors:
          type: array
          description: List of invalid fields for validation problems
          items:
            $ref: '#/components/schemas/ValidationError'

    Item:
      type: object
      required:
        - id
        - name
        - description
        - price
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Mechanical Keyboard"
        description:
          type: string
          example: "Ergonomic hot-swappable mechanical keyboard"
        price:
          type: integer
          format: int64
          description: Price in cents (e.g. 9900 = $99.00)
          example: 9900
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateItemRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          example: "Mechanical Keyboard"
        description:
          type: string
          maxLength: 1000
          example: "Ergonomic hot-swappable mechanical keyboard"
        price:
          type: integer
          format: int64
          minimum: 0
          example: 9900
