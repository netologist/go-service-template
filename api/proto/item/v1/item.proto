syntax = "proto3";

package item.v1;

option go_package = "github.com/netologist/go-service-template/pkg/proto/item/v1;itemv1";

import "google/protobuf/timestamp.proto";

// Item represents a catalog or business item.
message Item {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 price = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// CreateItemRequest contains parameters for registering a new item.
message CreateItemRequest {
  string name = 1;
  string description = 2;
  int64 price = 3;
}

// CreateItemResponse contains the registered item.
message CreateItemResponse {
  Item item = 1;
}

// FindItemsRequest contains optional filter parameters for querying items.
message FindItemsRequest {
  string name = 1;
}

// FindItemsResponse contains the list of retrieved items.
message FindItemsResponse {
  repeated Item items = 1;
}

// ItemService provides remote procedure calls for item management.
service ItemService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc FindItems(FindItemsRequest) returns (FindItemsResponse);
}
