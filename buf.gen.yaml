version: v2
plugins:
  # Server-side generated code under internal/gen/grpc
  - local: protoc-gen-go
    out: internal/gen/grpc
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/gen/grpc
    opt:
      - paths=source_relative

  # Client SDK generated code under pkg/proto
  - local: protoc-gen-go
    out: pkg/proto
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: pkg/proto
    opt:
      - paths=source_relative
