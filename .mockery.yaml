template: testify
packages:
  github.com/netologist/go-service-template/internal:
    config:
      all: true
      recursive: true
      exclude-subpkg-regex:
        - ".*/internal/gen/.*"
        - ".*/internal/adapter/.*"
      dir: "internal/gen/mocks/{{.SrcPackageName}}"
      pkgname: "{{.SrcPackageName}}mocks"
      filename: "{{.InterfaceName | snakecase}}_mock.go"
      structname: "Mock{{.InterfaceName}}"
